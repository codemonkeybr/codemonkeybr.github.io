<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="1000" height="440" rx="10" fill="#f6f6f7"/>

  <!-- Column headers -->
  <text x="225" y="38" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a4d8f">Recommended: one box</text>
  <text x="775" y="38" font-size="16" font-weight="bold" text-anchor="middle" fill="#8f4d1a">Case study: when I split</text>

  <!-- LEFT: single box -->
  <rect x="100" y="75" width="250" height="150" rx="10" fill="#eaf2ff" stroke="#1a4d8f" stroke-width="2.5"/>
  <text x="225" y="105" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Pi 4 / Pi 5</text>
  <text x="225" y="133" font-size="13" text-anchor="middle" fill="#333">rnsd</text>
  <text x="225" y="153" font-size="13" text-anchor="middle" fill="#333">nomadnet</text>
  <text x="225" y="173" font-size="13" text-anchor="middle" fill="#333">lxmd</text>
  <text x="225" y="205" font-size="12" text-anchor="middle" fill="#1a4d8f">headroom to spare</text>

  <text x="225" y="258" font-size="12" text-anchor="middle" fill="#555">default advice for most people —</text>
  <text x="225" y="275" font-size="12" text-anchor="middle" fill="#555">only split if hardware forces it,</text>
  <text x="225" y="292" font-size="12" text-anchor="middle" fill="#555">or you want the radio interface</text>
  <text x="225" y="309" font-size="12" text-anchor="middle" fill="#555">reachable on its own</text>

  <!-- RIGHT: two boxes -->
  <rect x="650" y="65" width="250" height="140" rx="10" fill="#fdeee0" stroke="#8f4d1a" stroke-width="2.5"/>
  <text x="775" y="93" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Pi 3 B</text>
  <text x="775" y="115" font-size="12" text-anchor="middle" fill="#333">rnsd + 2x nomadnet + lxmd</text>
  <text x="775" y="138" font-size="12" text-anchor="middle" fill="#8f4d1a">load avg ~9</text>
  <text x="775" y="158" font-size="12" text-anchor="middle" fill="#8f4d1a">84% RAM, 731MB swap</text>
  <text x="775" y="180" font-size="11" text-anchor="middle" fill="#555">overloaded</text>

  <g stroke="#8f4d1a" stroke-width="2.5" fill="none">
    <path d="M775,205 L775,240" marker-end="url(#arrow2)"/>
  </g>
  <text x="850" y="227" font-size="11" text-anchor="middle" fill="#555">move rnsd off</text>

  <rect x="650" y="245" width="250" height="130" rx="10" fill="#eaf2ff" stroke="#1a4d8f" stroke-width="2.5"/>
  <text x="775" y="273" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Pi 3 B+</text>
  <text x="775" y="295" font-size="12" text-anchor="middle" fill="#333">picks up rnsd only</text>
  <text x="775" y="317" font-size="12" text-anchor="middle" fill="#1a4d8f">was: load avg 0.57, 42% RAM</text>
  <text x="775" y="337" font-size="10" text-anchor="middle" fill="#555">(idle, running Grafana/InfluxDB)</text>

  <text x="775" y="400" font-size="12" text-anchor="middle" fill="#555">result: ~42% CPU / ~20% RAM freed</text>
  <text x="775" y="417" font-size="12" text-anchor="middle" fill="#555">on the Pi 3 B</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8f4d1a"/>
    </marker>
  </defs>
</svg>
