<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="1000" height="400" rx="10" fill="#f6f6f7"/>

  <!-- LAN devices -->
  <g fill="#1a1a1a">
    <rect x="40" y="55" width="170" height="60" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="125" y="90" font-size="15" text-anchor="middle">Phone</text>

    <rect x="40" y="150" width="170" height="60" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="125" y="185" font-size="15" text-anchor="middle">Laptop</text>

    <rect x="40" y="245" width="170" height="60" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <text x="125" y="272" font-size="15" text-anchor="middle">Other apps</text>
    <text x="125" y="290" font-size="12" text-anchor="middle" fill="#555">on your LAN</text>
  </g>

  <!-- lines from devices to gateway -->
  <g stroke="#888" stroke-width="2" fill="none">
    <path d="M210,85 L350,150"/>
    <path d="M210,180 L350,180"/>
    <path d="M210,275 L350,210"/>
  </g>
  <text x="280" y="172" font-size="12" text-anchor="middle" fill="#555">AutoInterface</text>

  <!-- Gateway box -->
  <rect x="350" y="100" width="260" height="150" rx="10" fill="#eaf2ff" stroke="#1a4d8f" stroke-width="2.5"/>
  <text x="480" y="138" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Your Gateway Node</text>
  <text x="480" y="163" font-size="13" text-anchor="middle" fill="#333">rnsd</text>
  <text x="480" y="184" font-size="13" text-anchor="middle" fill="#333">enable_transport = True</text>
  <text x="480" y="210" font-size="12" text-anchor="middle" fill="#555">one box, always on</text>

  <!-- outward arrow -->
  <g stroke="#1a4d8f" stroke-width="2.5" fill="none">
    <path d="M610,175 L768,175" marker-end="url(#arrow)"/>
  </g>
  <text x="695" y="153" font-size="10" text-anchor="middle" fill="#1a4d8f">BackboneInterface</text>
  <text x="695" y="166" font-size="10" text-anchor="middle" fill="#1a4d8f">TCPClientInterface</text>

  <!-- wider network box -->
  <rect x="780" y="100" width="210" height="150" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="885" y="138" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Wider</text>
  <text x="885" y="156" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Reticulum</text>
  <text x="885" y="174" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Network</text>
  <text x="885" y="202" font-size="11" text-anchor="middle" fill="#555">rmap.world</text>
  <text x="885" y="218" font-size="10" text-anchor="middle" fill="#555">directory.rns.recipes</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1a4d8f"/>
    </marker>
  </defs>

  <text x="500" y="370" font-size="12" text-anchor="middle" fill="#777">
    One gateway, transport enabled, serves every device on the LAN over the default interface.
  </text>
</svg>
