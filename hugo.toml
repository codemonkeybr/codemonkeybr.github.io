baseURL = 'https://codemonkeybr.github.com/'
languageCode = 'en-us'
title = 'codemonkeybr'
theme = 'PaperMod'

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

pygmentsUseClasses = true

[minify]
  disableXML = true

[params]
  env = 'production'
  description = 'Dispatches from my ~/dev folder — no shared universe, no continuing plot.'
  author = 'codemonkeybr'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  hidemeta = false

  [params.profileMode]
    enabled = true
    title = "codemonkeybr 🐒 💻 🇧🇷"
    subtitle = "Dispatches from my ~/dev folder — no shared universe, no continuing plot."
    imageUrl = "https://github.com/codemonkeybr.png"
    imageTitle = "codemonkeybr"
    imageWidth = 150
    imageHeight = 150

[[params.socialIcons]]
  name = 'github'
  url = 'https://github.com/codemonkeybr'

[[menu.main]]
  identifier = 'posts'
  name = 'Posts'
  url = '/posts/'
  weight = 10

[[menu.main]]
  identifier = 'tags'
  name = 'Tags'
  url = '/tags/'
  weight = 20

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = 'monokai'
  [markup.goldmark.renderer]
    unsafe = true

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[taxonomies]
  tag = 'tags'
